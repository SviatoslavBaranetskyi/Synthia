[project]
name = "moderation-service"
version = "0.1.0"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "torch",
    "transformers",
    "numpy",
    "scikit-learn",
    "core",
    "schemas",
    "datasets>=4.7.0",
    "pandas>=3.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moderation_service"]

[project]
name = "moderation-service"
version = "0.1.0"
requires-python = "==3.11.*"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "transformers==4.36.2",
    "numpy<2.0",
    "scikit-learn",
    "core",
    "schemas",
    "datasets>=4.7.0",
    "pandas>=3.0.1",
    "accelerate==0.25.0",
    "torch==2.5.0+cu121 ; python_version == '3.11'",
]

[tool.uv.sources]
torch = { url = "https://download.pytorch.org/whl/cu121/torch-2.5.0%2Bcu121-cp311-cp311-win_amd64.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moderation_service"]

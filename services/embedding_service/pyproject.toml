[project]
name = "embedding-service"
version = "0.1.0"

dependencies = [
    "fastapi",
    "uvicorn[standard]",

    "sentence-transformers",
    "faiss-cpu",

    "core",
    "schemas"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embedding_service"]
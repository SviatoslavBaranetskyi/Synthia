[project]
name = "generation-service"
version = "0.1.0"
requires-python = "==3.11.*"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings==2.13.1",

    "diffusers==0.37.1",
    "transformers==4.57.6",
    "accelerate==1.10.1",
    "safetensors==0.7.0",
    "huggingface-hub==0.36.2",
    "torch==2.5.1+cu121 ; python_version == '3.11'",
    "torchsde>=0.2.6",
    "Pillow>=10.0.0",
    "core",
    "schemas",
]

[tool.uv.sources]
torch = { url = "https://download.pytorch.org/whl/cu121/torch-2.5.1%2Bcu121-cp311-cp311-win_amd64.whl" }
core = { workspace = true }
schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generation_service"]
